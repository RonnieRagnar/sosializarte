<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <title>Centro de Operaciones · Sosializarte</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts (misma que tu sitio) -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
            background: #F7F4EF;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: #FDFCFA;
            border-radius: 22px;
            padding: 28px 24px 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #E8E4DC;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2px;
        }
        .header h1 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #0d0d0d;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.02em;
        }
        .header h1 i {
            color: #FF642E;
            font-size: 1.4rem;
        }
        .header .badge-sos {
            background: #FF642E;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 999px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: 'DM Sans', sans-serif;
        }
        .header .version {
            font-size: 0.65rem;
            color: #6b6b6b;
            background: #F7F4EF;
            padding: 3px 12px;
            border-radius: 999px;
            font-weight: 500;
        }
        .sub {
            color: #6b6b6b;
            font-size: 0.85rem;
            border-bottom: 1px solid #E8E4DC;
            padding-bottom: 14px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* ─── DASHBOARD ─── */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        @media (min-width: 480px) {
            .dashboard-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .dash-card {
            background: #F7F4EF;
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid #E8E4DC;
            transition: background 0.15s, transform 0.15s;
        }
        .dash-card:hover {
            background: #f0ece6;
            transform: translateY(-2px);
        }
        .dash-card .num {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #0d0d0d;
            line-height: 1.2;
        }
        .dash-card .label {
            font-size: 0.7rem;
            color: #6b6b6b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }
        .dash-card .icon {
            font-size: 0.85rem;
            color: #FF642E;
            margin-right: 4px;
        }

        /* ─── BUSCADOR ─── */
        .search-wrap {
            position: relative;
            margin-bottom: 18px;
        }
        .search-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b6b6b;
            font-size: 0.9rem;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1.5px solid #E8E4DC;
            border-radius: 999px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            background: #FDFCFA;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            color: #0d0d0d;
        }
        .search-wrap input:focus {
            border-color: #FF642E;
            box-shadow: 0 0 0 3px rgba(255, 100, 46, 0.10);
        }
        .search-wrap input::placeholder {
            color: #aaa;
            font-weight: 300;
        }
        .search-results-count {
            font-size: 0.7rem;
            color: #6b6b6b;
            margin-top: 4px;
            text-align: right;
            display: none;
            font-weight: 300;
        }
        .search-results-count.visible {
            display: block;
        }

        /* ─── FAVORITOS ─── */
        .fav-section {
            background: #FDFCFA;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 18px;
            border: 1px dashed #C9C4BB;
        }
        .fav-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #6b6b6b;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fav-title i {
            color: #FFCC99;
        }
        .fav-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
        }
        .fav-item {
            font-size: 0.8rem;
            font-weight: 500;
            color: #0d0d0d;
            background: #fff;
            padding: 4px 12px 4px 10px;
            border-radius: 999px;
            border: 1px solid #E8E4DC;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
            transition: border-color 0.15s;
        }
        .fav-item i {
            color: #FFCC99;
            font-size: 0.7rem;
        }
        .fav-item .fav-remove {
            color: #C9C4BB;
            font-size: 0.6rem;
            cursor: pointer;
            margin-left: 4px;
            transition: color 0.15s;
        }
        .fav-item .fav-remove:hover {
            color: #CC0033;
        }

        /* ─── CATEGORÍAS ─── */
        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .category {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #E8E4DC;
            transition: border-color 0.2s;
        }
        .category:hover {
            border-color: #C9C4BB;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: #FDFCFA;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }
        .category-header:hover {
            background: #F7F4EF;
        }
        .category-header .cat-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #0d0d0d;
            font-family: 'DM Sans', sans-serif;
        }
        .category-header .cat-left i {
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }
        .category-header .cat-count {
            font-size: 0.65rem;
            font-weight: 600;
            color: #6b6b6b;
            background: #F7F4EF;
            padding: 1px 10px;
            border-radius: 999px;
            margin-left: 4px;
        }
        .category-header .cat-arrow {
            font-size: 0.75rem;
            color: #6b6b6b;
            transition: transform 0.25s ease;
        }
        .category-header.open .cat-arrow {
            transform: rotate(180deg);
        }

        .category-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 18px;
            background: #FDFCFA;
        }
        .category-body.open {
            max-height: 2000px;
            padding: 8px 18px 14px 18px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #F7F4EF;
            gap: 8px;
        }
        .resource-item:last-child {
            border-bottom: none;
        }
        .resource-item .res-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .resource-item .res-left i {
            font-size: 0.9rem;
            width: 18px;
            color: #4a4a4a;
            text-align: center;
            flex-shrink: 0;
        }
        .resource-item .res-left .res-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #0d0d0d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .resource-item .res-left .res-url {
            font-size: 0.65rem;
            color: #6b6b6b;
            font-family: monospace;
            background: #F7F4EF;
            padding: 2px 10px;
            border-radius: 999px;
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }
        @media (min-width: 480px) {
            .resource-item .res-left .res-url {
                display: inline-block;
            }
        }
        .resource-item .res-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .btn-icon {
            background: none;
            border: none;
            font-size: 0.75rem;
            color: #6b6b6b;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all 0.15s;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-icon:hover {
            background: #F7F4EF;
            color: #0d0d0d;
        }
        .btn-icon.open-link {
            color: #336699;
        }
        .btn-icon.open-link:hover {
            background: #E8F0F8;
            color: #1a3d5c;
        }
        .btn-icon.copy-link {
            color: #669933;
        }
        .btn-icon.copy-link:hover {
            background: #E8F5E8;
            color: #4d7a26;
        }
        .btn-icon.fav-star {
            color: #C9C4BB;
        }
        .btn-icon.fav-star.active {
            color: #FFCC99;
        }
        .btn-icon.fav-star:hover {
            background: #FCF0E0;
        }

        /* ─── FOOTER ─── */
        .footer-note {
            margin-top: 18px;
            font-size: 0.65rem;
            color: #6b6b6b;
            text-align: center;
            border-top: 1px solid #E8E4DC;
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-weight: 300;
        }

        /* ─── COLORS PER CATEGORY ─── */
        .cat-clientes .category-header { border-left: 4px solid #FF642E; }
        .cat-recursos .category-header { border-left: 4px solid #336699; }
        .cat-pagos .category-header { border-left: 4px solid #669933; }
        .cat-marketing .category-header { border-left: 4px solid #CC0033; }
        .cat-ia .category-header { border-left: 4px solid #9933CC; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 16px 14px 14px; border-radius: 18px; }
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .dash-card { padding: 10px 8px; }
            .dash-card .num { font-size: 1.2rem; }
            .resource-item { flex-wrap: wrap; }
            .resource-item .res-actions { width: 100%; justify-content: flex-end; }
            .resource-item .res-left .res-url { display: none; }
            .fav-list { gap: 4px; }
            .fav-item { font-size: 0.75rem; padding: 3px 8px 3px 6px; }
            .header h1 { font-size: 1.3rem; }
        }
        @media (min-width: 600px) {
            .resource-item .res-left .res-url { max-width: 200px; }
        }
        @media (min-width: 800px) {
            .resource-item .res-left .res-url { max-width: 300px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ─── HEADER ─── -->
    <div class="header">
        <h1><i class="fas fa-cubes"></i> Centro de Operaciones</h1>
        <span class="badge-sos">Sosializarte</span>
    </div>
    <div class="sub">Panel de control interno · Enlaces, recursos y herramientas</div>

    <!-- ─── DASHBOARD ─── -->
    <div class="dashboard-grid" id="dashboardGrid">
        <div class="dash-card">
            <div class="num"><span id="countClientes">4</span></div>
            <div class="label"><i class="fas fa-user icon"></i> Clientes</div>
        </div>
        <div class="dash-card">
            <div class="num"><span id="countProyectos">3</span></div>
            <div class="label"><i class="fas fa-folder-open icon"></i> Proyectos</div>
        </div>
        <div class="dash-card">
            <div class="num"><span id="countPendientes">5</span></div>
            <div class="label"><i class="fas fa-clock icon" style="color:#CC0033;"></i> Pendientes</div>
        </div>
        <div class="dash-card">
            <div class="num"><span id="countIngresos">$2,000</span></div>
            <div class="label"><i class="fas fa-credit-card icon" style="color:#669933;"></i> Ingresos del mes</div>
        </div>
    </div>

    <!-- ─── BUSCADOR ─── -->
    <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar recurso, cliente, herramienta..." autocomplete="off" />
        <div class="search-results-count" id="searchCount">0 resultados</div>
    </div>

    <!-- ─── FAVORITOS ─── -->
    <div class="fav-section" id="favSection">
        <div class="fav-title"><i class="fas fa-star"></i> Favoritos</div>
        <div class="fav-list" id="favList">
            <span style="font-size:0.75rem; color:#6b6b6b;">No hay favoritos aún. Haz clic en la estrella ⭐ en cualquier recurso.</span>
        </div>
    </div>

    <!-- ─── CATEGORÍAS ─── -->
    <div class="category-grid" id="categoryGrid"></div>

    <!-- ─── FOOTER ─── -->
    <div class="footer-note">
        <span><i class="far fa-clock"></i> <span id="updateDate"></span></span>
        <span><i class="fas fa-arrow-up-right-from-square"></i> <span id="totalRecursos">0</span> recursos</span>
    </div>
</div>

<script>
    // ─── DATA ───
    const resources = [
        // Clientes
        { category: 'clientes', icon: 'fa-user', label: 'Cuestionario de implementación', url: 'https://sosializarte.com/cuestionario' },
        { category: 'clientes', icon: 'fa-globe', label: 'Web desde cero', url: 'https://sosializarte.com/cuestionario-web' },
        { category: 'clientes', icon: 'fa-rotate', label: 'Rediseño + Chatbot', url: 'https://sosializarte.com/cuestionario-rediseno' },
        { category: 'clientes', icon: 'fa-credit-card', label: 'Link de pago Clip', url: 'https://linkdenegocio.mx/@sosializarte' },

        // Recursos
        { category: 'recursos', icon: 'fa-file-lines', label: 'Aviso de privacidad', url: 'https://sosializarte.com/privacidad' },
        { category: 'recursos', icon: 'fa-home', label: 'Mi sitio web', url: 'https://sosializarte.com' },
        { category: 'recursos', icon: 'fa-folder-open', label: 'Dashboard (esta página)', url: 'https://sosializarte.com/dashboard' },

        // Pagos
        { category: 'pagos', icon: 'fa-credit-card', label: 'Link de pago (Clip)', url: 'https://linkdenegocio.mx/@sosializarte' },
        { category: 'pagos', icon: 'fa-file-invoice', label: 'Registro de pagos (Clip)', url: 'https://linkdenegocio.mx/@sosializarte/pagos' },

        // Marketing
        { category: 'marketing', icon: 'fa-instagram', label: 'Instagram @solidmakermx', url: 'https://instagram.com/solidmakermx' },
        { category: 'marketing', icon: 'fa-whatsapp', label: 'WhatsApp Business', url: 'https://wa.me/525540509093' },

        // IA
        { category: 'ia', icon: 'fa-robot', label: 'Chatbot Solid Maker', url: 'https://solidmaker.mx' },
        { category: 'ia', icon: 'fa-brain', label: 'Prompts IA (Notion)', url: 'https://notion.so/...' },
    ];

    const categoryMeta = {
        clientes: { label: 'Clientes', icon: 'fa-user', color: '#FF642E' },
        recursos: { label: 'Recursos', icon: 'fa-folder', color: '#336699' },
        pagos: { label: 'Pagos', icon: 'fa-credit-card', color: '#669933' },
        marketing: { label: 'Marketing', icon: 'fa-bullhorn', color: '#CC0033' },
        ia: { label: 'IA y Automatización', icon: 'fa-robot', color: '#9933CC' },
    };

    // ─── ESTADO ───
    let favorites = JSON.parse(localStorage.getItem('sos_favorites')) || [];
    let currentSearch = '';

    // ─── RENDER ───
    function render() {
        const searchTerm = currentSearch.toLowerCase().trim();
        const container = document.getElementById('categoryGrid');
        const favList = document.getElementById('favList');
        const totalRecursos = document.getElementById('totalRecursos');

        let filtered = resources;
        if (searchTerm) {
            filtered = resources.filter(r =>
                r.label.toLowerCase().includes(searchTerm) ||
                r.url.toLowerCase().includes(searchTerm) ||
                r.category.toLowerCase().includes(searchTerm)
            );
        }

        const searchCount = document.getElementById('searchCount');
        if (searchTerm) {
            searchCount.textContent = `${filtered.length} resultados`;
            searchCount.classList.add('visible');
        } else {
            searchCount.classList.remove('visible');
        }

        const grouped = {};
        filtered.forEach(r => {
            if (!grouped[r.category]) grouped[r.category] = [];
            grouped[r.category].push(r);
        });

        let html = '';
        for (const [catKey, items] of Object.entries(grouped)) {
            const meta = categoryMeta[catKey] || { label: catKey, icon: 'fa-folder', color: '#666' };
            const isFav = (item) => favorites.includes(item.url);
            const isOpen = !searchTerm;

            html += `
                <div class="category cat-${catKey}">
                    <div class="category-header ${isOpen ? 'open' : ''}" onclick="toggleCategory(this)">
                        <div class="cat-left">
                            <i class="fas ${meta.icon}" style="color:${meta.color};"></i>
                            ${meta.label}
                            <span class="cat-count">${items.length}</span>
                        </div>
                        <span class="cat-arrow">▼</span>
                    </div>
                    <div class="category-body ${isOpen ? 'open' : ''}">
                        ${items.map(r => `
                            <div class="resource-item" data-url="${r.url}" data-label="${r.label}">
                                <div class="res-left">
                                    <i class="fas ${r.icon}"></i>
                                    <span class="res-label">${r.label}</span>
                                    <span class="res-url">${r.url.replace(/^https?:\/\//, '')}</span>
                                </div>
                                <div class="res-actions">
                                    <button class="btn-icon fav-star ${isFav(r) ? 'active' : ''}" onclick="toggleFav('${r.url}')" title="Favorito">
                                        <i class="fas fa-star"></i>
                                    </button>
                                    <button class="btn-icon open-link" onclick="openUrl('${r.url}')" title="Abrir">
                                        <i class="fas fa-arrow-up-right-from-square"></i>
                                    </button>
                                    <button class="btn-icon copy-link" onclick="copyUrl(this, '${r.url}')" title="Copiar enlace">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        if (filtered.length === 0) {
            html = `
                <div style="text-align:center;padding:40px 20px;color:#6b6b6b;background:#FDFCFA;border-radius:16px;border:1px solid #E8E4DC;">
                    <i class="fas fa-search" style="font-size:2rem;display:block;margin-bottom:10px;color:#C9C4BB;"></i>
                    <p style="font-weight:300;">No se encontraron recursos para "<strong style="color:#0d0d0d;">${searchTerm}</strong>"</p>
                </div>
            `;
        }

        container.innerHTML = html;

        // Favoritos
        const favItems = resources.filter(r => favorites.includes(r.url));
        if (favItems.length === 0) {
            favList.innerHTML = `<span style="font-size:0.75rem; color:#6b6b6b;">No hay favoritos aún. Haz clic en la estrella ⭐ en cualquier recurso.</span>`;
        } else {
            favList.innerHTML = favItems.map(r => `
                <span class="fav-item">
                    <i class="fas fa-star"></i> ${r.label}
                    <span class="fav-remove" onclick="toggleFav('${r.url}')" title="Quitar de favoritos">✕</span>
                </span>
            `).join('');
        }

        totalRecursos.textContent = resources.length;

        document.getElementById('countClientes').textContent = resources.filter(r => r.category === 'clientes').length;
        document.getElementById('countProyectos').textContent = resources.filter(r => r.category === 'pagos' || r.category === 'ia').length;
        document.getElementById('countPendientes').textContent = resources.filter(r => r.category === 'marketing').length;
    }

    // ─── FUNCIONES ───
    function toggleCategory(header) {
        const body = header.nextElementSibling;
        const isOpen = body.classList.contains('open');
        body.classList.toggle('open');
        header.classList.toggle('open');
    }

    function openUrl(url) {
        window.open(url, '_blank');
    }

    function copyUrl(btn, url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
                showCopied(btn);
            }).catch(() => {
                fallbackCopy(btn, url);
            });
        } else {
            fallbackCopy(btn, url);
        }
    }

    function fallbackCopy(btn, url) {
        const textArea = document.createElement('textarea');
        textArea.value = url;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showCopied(btn);
        } catch (e) {
            alert('Copiar manualmente: ' + url);
        }
        document.body.removeChild(textArea);
    }

    function showCopied(btn) {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        btn.style.color = '#669933';
        setTimeout(() => {
            btn.innerHTML = original;
            btn.style.color = '';
        }, 1500);
    }

    function toggleFav(url) {
        const idx = favorites.indexOf(url);
        if (idx > -1) {
            favorites.splice(idx, 1);
        } else {
            favorites.push(url);
        }
        localStorage.setItem('sos_favorites', JSON.stringify(favorites));
        render();
    }

    // ─── BUSCADOR ───
    document.getElementById('searchInput').addEventListener('input', function() {
        currentSearch = this.value;
        render();
    });

    // ─── FECHA ───
    document.getElementById('updateDate').textContent = new Date().toLocaleDateString('es-MX', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
    });

    // ─── RENDER INICIAL ───
    render();
</script>

</body>
</html>
